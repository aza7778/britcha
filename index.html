<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Britcha</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2033;--mu:#667085;--ac:#2f5bea;--soft:#e8eeff;--bd:#e2e6f0;--ok:#16a34a;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121b;--card:#181c28;--tx:#eef0f6;--mu:#98a0b3;--ac:#6d8cff;--soft:#222a42;--bd:#2a3042}}
:root[data-theme="dark"]{--bg:#0f121b;--card:#181c28;--tx:#eef0f6;--mu:#98a0b3;--ac:#6d8cff;--soft:#222a42;--bd:#2a3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
.top{max-width:820px;margin:auto;padding:10px 16px;font-weight:700;font-size:18px}
.top small{color:var(--mu);font-weight:400;margin-left:8px;font-size:12px}
nav{max-width:820px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mu);padding:7px 13px;border-radius:99px;font-size:14px}
nav a.on{background:var(--ac);color:#fff}
main{max-width:820px;margin:auto;padding:18px 16px 60px}
h1{font-size:28px;margin:6px 0}h2{margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.tile b{display:block;color:var(--ac);font-size:17px}.tile span{color:var(--mu);font-size:14px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin:4px 6px 4px 0;display:inline-block}
button.g,.btn.g{background:var(--soft);color:var(--ac)}
button.x{background:none;color:var(--er);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:130px}
.w{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:9px 0}
.w:last-child{border:0}.w em{color:var(--mu);font-style:normal;margin-left:8px}
.big{font-size:30px;font-weight:700;text-align:center;margin:10px 0}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}
.msg{white-space:pre-wrap;background:var(--soft);color:var(--ac);padding:10px 12px;border-radius:10px;margin:10px 0;display:none}
.stat{font-size:34px;font-weight:700;color:var(--ac)}
pre{white-space:pre-wrap;font:inherit;margin:0}
:root:root{--bg:#0a0b1e;--card:#12142e;--tx:#fff;--mu:#a3a8c8;--ac:#7c5cff;--soft:#241f4d;--bd:#262a4d}
:root:root[data-theme="light"]{--bg:#f4f5ff;--card:#fff;--tx:#161a3a;--mu:#666b8f;--ac:#6c4cf5;--soft:#ece9ff;--bd:#e0e2f3}
body{font-family:Poppins,system-ui,sans-serif}
header{background:var(--bg);border:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}.top b{display:block;font-size:20px;line-height:1.2}.top small{display:block;margin:0;font-size:12px}
.flag{width:46px;height:46px}
nav{padding:6px 16px 12px}
nav a{border-radius:14px;padding:10px 16px;font-size:15px}
nav a.on{background:linear-gradient(135deg,#8b6cff,#6b4cf0);color:#fff;box-shadow:0 6px 20px #6b4cf055}
.bar{max-width:820px;margin:auto;display:flex;gap:10px;padding:6px 16px 12px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 14px;min-width:0}
.search input{border:0;background:none;margin:0;padding:14px 0;min-width:0}
kbd{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--mu);font-family:inherit}
.ic{width:46px;height:46px;border-radius:14px;padding:0;margin:0;background:var(--ac);font-size:18px;flex:none}
.ic.p{background:var(--card);border:1px solid var(--bd)}
#sres{display:none;max-width:788px;margin:0 auto 10px;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;width:calc(100% - 32px)}
.card,.tile{border-radius:20px;background:var(--card)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:34px 26px;margin-bottom:18px;background:linear-gradient(135deg,#1a1450,#2b1d6e 60%,#150f3d);border:1px solid var(--bd);display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;color:#fff}
.hl{max-width:480px;position:relative;z-index:1}.hl small{color:#a98bff;letter-spacing:2px;font-weight:600}
.hl h1{font-size:36px;line-height:1.15;margin:10px 0}.hl p{color:#cfd2f0}
.go{display:inline-block;margin-top:10px;padding:14px 26px;border-radius:14px;background:linear-gradient(135deg,#8b6cff,#6b4cf0);color:#fff;text-decoration:none;font-weight:600;box-shadow:0 8px 24px #6b4cf066}
.goal{position:relative;z-index:1;align-self:flex-start;background:#181a3f;border:1px solid #34386a;border-radius:16px;padding:14px 18px;min-width:210px}
.goal small{color:#a3a8c8;display:block}.goal b{display:block;font-size:18px}
.pb{height:6px;background:#2a2d5a;border-radius:9px;margin:10px 0;overflow:hidden}.pb i{display:block;height:100%;background:#8b6cff}
.goal span{display:flex;justify-content:space-between;color:#a3a8c8;font-size:14px}.goal em{font-style:normal}
.tower{position:absolute;right:24px;bottom:0;width:120px;opacity:.3}
.ti{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--soft);font-style:normal;font-size:22px;margin-bottom:12px}
.tile b{color:var(--tx)}
.scene{position:absolute;right:0;bottom:0;height:100%;width:62%;pointer-events:none}
@media(max-width:560px){.scene{width:100%;opacity:.4}}
.ti svg{width:24px;height:24px;color:var(--ac)}
.ic svg{width:20px;height:20px;color:#fff}.ic.p svg{color:var(--ac)}
.search>svg{width:20px;height:20px;color:var(--mu);flex:none}

.scene{display:none}
.art{position:absolute;right:0;top:0;height:100%;width:64%;object-fit:cover;object-position:left center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%);mask-image:linear-gradient(90deg,transparent,#000 38%);pointer-events:none}
@media(max-width:560px){.art{width:100%;opacity:.35}}
.hero{min-height:250px}
.ti{border-radius:50%;background:linear-gradient(135deg,#2c2670,#1b1850)}
.tile{position:relative;padding-bottom:44px}.tile .ar{position:absolute;left:16px;bottom:12px;font-style:normal;color:var(--ac);font-size:18px}
.prem{display:none;margin:12px 14px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#2a1d6e,#1a1450);border:1px solid var(--bd);color:#fff}
.prem b{display:block}.prem small{display:block;color:#b9bce0;margin:2px 0 10px;font-size:12px}
.prem a{display:block;text-align:center;padding:10px;border-radius:12px;background:linear-gradient(135deg,#8b6cff,#6b4cf0);color:#fff;text-decoration:none;font-weight:600}
.sh{margin:20px 0 10px;font-size:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}.two .card{margin:0}
.act{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.act:last-child{border:0}.act i{color:var(--ok);font-style:normal}
.quote{position:relative;overflow:hidden;background:linear-gradient(160deg,#1b1650,#0f1233);color:#fff;min-height:140px;display:flex;align-items:flex-end}
.quote svg{position:absolute;right:0;bottom:0;width:72%;height:80%;opacity:.55}.quote p{position:relative;font-size:18px;font-weight:600;margin:0}
@media(min-width:860px){
header{position:fixed;left:0;top:0;bottom:0;width:250px;overflow-y:auto;border-right:1px solid var(--bd);display:flex;flex-direction:column}
nav{flex-direction:column;overflow:visible;padding:8px 14px;flex:1}nav a{padding:12px 16px}
.wrap{margin-left:250px}.bar,main{max-width:1060px}.prem{display:block}}
#lvbar{max-width:820px;margin:auto;padding:8px 16px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#lvbar span{color:var(--mu);font-size:14px;margin-right:4px}
#lvbar button{margin:0;padding:6px 14px;border-radius:99px;font-size:14px}
@media(min-width:860px){#lvbar{max-width:1060px}}
</style></head><body>
<header><div class="top"><svg class="flag" viewBox="0 0 60 60"><clipPath id="fc"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#fc)"><rect width="60" height="60" fill="#012169"/><path d="M0 0L60 60M60 0L0 60" stroke="#fff" stroke-width="10"/><path d="M0 0L60 60M60 0L0 60" stroke="#C8102E" stroke-width="4"/><path d="M30 0V60M0 30H60" stroke="#fff" stroke-width="16"/><path d="M30 0V60M0 30H60" stroke="#C8102E" stroke-width="9"/></g></svg><div><b>British English</b><small>Learn · Practice · Be Fluent</small></div></div>
<nav id="nav"></nav><div class="prem"><b>👑 Premium</b><small>Barcha imkoniyatlar ochiq</small><a href="#settings">Yuksaltirish</a></div></header><div class="wrap"><div class="bar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="sq" placeholder="Nima o'rganmoqchisiz? So'z yoki tarjima yozing" onkeydown="qs(event)" autocomplete="off"><kbd>Ctrl K</kbd></div><button class="ic" title="Mavzu" onclick="tg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button><button class="ic p" title="Sozlamalar" onclick="location.hash='#settings'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button></div><div id="sres"></div>
<div id="lvbar"></div><main id="app"></main></div>
<script>

/* Claude ichida emas: AI so'rovlari /api/chat serveri orqali ketadi */
(function(){
 const small=async f=>{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return{media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.8).split(",")[1]}};
 const call=async(input,o)=>{o=o||{};const messages=typeof input==="string"?[{role:"user",content:input}]:input;
  const images=o.images&&o.images.length?await Promise.all([...o.images].slice(0,5).map(small)):[];
  let resp;try{resp=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,images})})}catch(e){throw{code:"error",message:"tarmoq xatosi"}}
  if(!resp.ok){const t=await resp.text().catch(()=>"");throw{code:resp.status===429?"rate_limited":"error",message:resp.status+" "+t.replace(/\s+/g," ").slice(0,220)}}
  const d=await resp.json();return{text:d.text,truncated:false}};
 call.json=async(i,o)=>{const r=await call(i,o),t=r.text.replace(/```json|```/g,"").trim(),m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)};
 call.limits=async()=>({images:true});
 window.claude={use:async n=>n==="sample"?call:null};
})();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};
const st={get(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let words=st.get('words',[{en:'book',uz:'kitob'},{en:'water',uz:'suv'},{en:'house',uz:'uy'},{en:'friend',uz:"do'st"},{en:'tomorrow',uz:'ertaga'}]);
let stats=st.get('stats',{ok:0,no:0,added:0});
if(st.get('theme',''))document.documentElement.dataset.theme=st.get('theme','');
const save=()=>{st.set('words',words);st.set('stats',stats)};
const bump=ok=>{ok?stats.ok++:stats.no++;save()};
const pick=()=>words[Math.floor(Math.random()*words.length)];
const msg=t=>{const m=$('#msg');if(m){m.style.display=t?'block':'none';m.textContent=t||''}};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';const v=speechSynthesis.getVoices().find(v=>v.lang==='en-GB');if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
async function ai(p,o){const s=window.claude&&await claude.use('sample');if(!s)throw {code:'na'};return s(p,o)}
const aiErr=e=>e&&e.code==='not_granted'?'AI ruxsat berilmagan.':e&&e.code==='rate_limited'?'Juda tez-tez so\'rov. Biroz kuting.':e&&e.code==='na'?'AI bu yerda mavjud emas (saytni claude.ai orqali oching).':'Xatolik yuz berdi, qayta urinib ko\'ring.'+(e&&e.message?' ['+e.message+']':'');
const empty='<div class="card">Avval Vocabulary bo\'limida so\'z qo\'shing.</div>';
let cur=null,lastText='',chat=[];
const LV=()=>` Target CEFR level: ${st.get('level','A2')} (adjust vocabulary, grammar and complexity to this level).`;
async function aiBox(id,p){msg(`AI o'ylayapti...`);try{const r=await ai(p);msg('');$('#'+id).innerHTML='<pre>'+esc(r.text)+'</pre>';return r.text}catch(e){msg(aiErr(e))}}
async function sj(p){const s=window.claude&&await claude.use('sample');if(!s)throw{code:'na'};return s.json(p)}
function ask(){const q=$('#q').value.trim();if(q)aiBox('out',`Sen ingliz tili o'qituvchisisan. O'zbek tilida qisqa va tushunarli javob ber.${LV()} Savol: ${q}`)}
async function topicW(){const t=$('#topic').value.trim();if(!t)return;msg(`AI so'z tanlayapti...`);try{const r=await sj(`"${t}" mavzusida 10 ta foydali British English so'zi tanlang.${LV()} Faqat JSON massiv qaytaring: [{"en":"word","uz":"tarjima"}]`);const have=new Set(words.map(w=>w.en.toLowerCase()));let n=0;(Array.isArray(r)?r:[]).forEach(x=>{if(x&&x.en&&x.uz&&!have.has(String(x.en).toLowerCase())){words.unshift({en:String(x.en),uz:String(x.uz)});n++}});stats.added+=n;save();render();msg(n?`${n} ta yangi so'z qo'shildi.`:`Yangi so'z topilmadi.`)}catch(e){msg(aiErr(e))}}
async function ex(i){const w=words[i];msg(`AI misol yozyapti...`);try{const r=await ai(`"${w.en}" (${w.uz}) so'zi bilan 2 ta oddiy British English misol gap yozing, har birining o'zbekcha tarjimasi bilan.${LV()} Faqat matn.`);msg(`${w.en}: ${r.text}`);$('#msg').scrollIntoView({block:'center'})}catch(e){msg(aiErr(e))}}
async function aiDict(){msg(`AI gap yozyapti...`);try{const l=words.slice(0,10).map(w=>w.en).join(', ');const r=await sj(`Write ONE British English sentence (6-10 words) using some of: ${l}.${LV()} Return only JSON: {"en":"sentence","uz":"o'zbekcha tarjima"}`);if(!r||!r.en)throw{};cur={en:String(r.en),uz:String(r.uz||'')};msg('');$('#ans').value='';$('#res').textContent='';speak(cur.en)}catch(e){msg(aiErr(e))}}
function showChat(){$('#chat').innerHTML=chat.slice(1).map(m=>`<p><b>${m.role==='user'?'Siz':'AI'}:</b> ${esc(m.content)}</p>`).join('')}
async function chatTurn(){msg(`AI yozyapti...`);try{const s=window.claude&&await claude.use('sample');if(!s)throw{code:'na'};const r=await s(chat,{cache:false});chat.push({role:'assistant',content:r.text});msg('');showChat();speak(r.text.split('\n')[0])}catch(e){msg(aiErr(e))}}
function chatStart(){chat=[{role:'user',content:`Let's practise spoken British English.${LV()} Ask me ONE short question in English. After each of my answers: first give a one-line correction or praise in Uzbek, then ask a new short question in English. Keep replies short.`}];$('#chat').innerHTML='';chatTurn()}
function chatSend(){const t=$('#cin').value.trim();if(!t)return;if(!chat.length)return chatStart();chat.push({role:'user',content:t});$('#cin').value='';showChat();chatTurn()}
function dict(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){msg('Brauzer ovozni tanimaydi.');return}const r=new R();r.lang='en-GB';r.onresult=e=>{$('#cin').value=e.results[0][0].transcript};r.onerror=()=>msg('Mikrofon ishlamadi.');try{r.start()}catch(e){}}
async function mkQ(){if(!lastText){msg('Avval matn yarating.');return}await aiBox('out2',`Text: ${lastText} --- Write 3 short comprehension questions in English about the text, then an answer key with short Uzbek explanations. Plain text.`)}
function coach(){aiBox('out',`O'zbek tilida qisqa maslahat ber. O'quvchi: ${words.length} ta so'z, ${stats.ok} ta to'g'ri, ${stats.no} ta noto'g'ri javob. So'zlari: ${words.slice(0,20).map(w=>w.en).join(', ')}. Keyingi qadamlar va qisqa mashq rejasini yoz.`)}
function setLv(l){st.set('level',l);lvDraw();render()}
const NAV=[['home','Bosh sahifa'],['vocabulary','Vocabulary'],['listening','Listening'],['speaking','Speaking'],['reading','Reading'],['writing','Writing'],['stats','Statistika'],['settings','Sozlamalar']];
const sv=p=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">${p}</svg>`;
const IC={home:sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),vocabulary:sv('<path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 19a2 2 0 0 1 2-2h12"/>'),listening:sv('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>'),speaking:sv('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>'),reading:sv('<path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>'),writing:sv('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),stats:sv('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'),settings:sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>')};
$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-p="${n[0]}">${IC[n[0]]} ${n[1]}</a>`).join('');

function tg(){theme(document.documentElement.dataset.theme==='light'?'dark':'light')}
async function qs(e){if(e.key!=='Enter')return;const q=e.target.value.trim(),o=$('#sres');if(!q)return;const l=q.toLowerCase(),m=words.filter(w=>w.en.toLowerCase().includes(l)||w.uz.toLowerCase().includes(l));o.style.display='block';if(m.length){o.innerHTML=m.map(w=>`<b>${esc(w.en)}</b> — ${esc(w.uz)}`).join('<br>');return}o.textContent="AI tarjima qilyapti...";try{const r=await ai(`Ingliz↔o'zbek tarjima qiling, qisqa: "${q}". Inglizcha so'z bo'lsa, tarjimasi va 1 ta misol gap bering.${LV()}`);o.textContent=r.text;o.style.whiteSpace='pre-wrap'}catch(x){o.textContent=aiErr(x)}}

async function fromImg(files){
 if(!files.length)return;msg('AI rasmni o\'qiyapti...');
 try{const s=window.claude&&await claude.use('sample');if(!s)throw {code:'na'};
  const lim=await s.limits();if(!lim.images){msg('Rasm yuklash bu yerda qo\'llab-quvvatlanmaydi.');return}
  const r=await s.json('Bu rasmlarda ingliz tilidagi so\'zlar bor. Ularni toping (ko\'pi bilan 30 ta) va har biriga o\'zbekcha tarjima bering. Faqat JSON massiv qaytaring, boshqa matn yo\'q: [{"en":"word","uz":"tarjima"}]',{images:[...files]});
  const arr=(Array.isArray(r)?r:[]).filter(x=>x&&x.en&&x.uz);
  const have=new Set(words.map(w=>w.en.toLowerCase()));let n=0;
  arr.forEach(x=>{if(!have.has(String(x.en).toLowerCase())){words.unshift({en:String(x.en),uz:String(x.uz)});n++}});
  stats.added+=n;save();render();msg(n?`${n} ta yangi so'z qo'shildi.`:'Yangi so\'z topilmadi.');
 }catch(e){msg(aiErr(e))}
}

async function rdGen(){const own=$("#rdown").value.trim(),tp=$("#rdt").value.trim();msg("AI tayyorlayapti...");
 try{const fmt='Return only JSON: {"text":"","uz":"o\'zbekcha tarjima","q":[{"q":"","o":["","","",""],"a":0}]} where a is the index of the correct option.';
  const r=await sj(own?`Text: """${own}""" Make 4 multiple-choice comprehension questions about this text. Set "text" to the given text unchanged. ${fmt}`:`Write a British English reading text (90-130 words) at CEFR level ${lvNow()}${tp?" about "+tp:""}${words.length?", try to use some of these words: "+words.slice(0,8).map(w=>w.en).join(", "):""}. Then write 4 multiple-choice comprehension questions. ${fmt}`);
  if(!r||!r.text||!Array.isArray(r.q))throw{};
  rd=r;rdOk=0;rdDone=0;msg("");

 }catch(e){msg(aiErr(e))}}
function rdAns(i,j,b){const q=rd.q[i],par=b.parentNode;if(par.dataset.d)return;par.dataset.d=1;const ok=j===+q.a;bump(ok);if(ok)rdOk++;
 [...par.children].forEach((x,k)=>{if(k===+q.a){x.style.background="var(--ok)";x.style.color="#fff"}else if(k===j){x.style.background="var(--er)";x.style.color="#fff"}});

 r.onend=()=>{rdRec=null;const b=$("#rdrb");if(b)b.textContent="🎤 O'zim ovoz chiqarib o'qiyman";
  const a=rd.text.toLowerCase().match(/[a-z']+/g)||[],h=new Set(t.toLowerCase().match(/[a-z']+/g)||[]),m=a.filter(w=>h.has(w)).length,pc=Math.round(m/(a.length||1)*100);
  $("#rdres2").innerHTML=`O'qish aniqligi: <b>${pc}%</b> ${pc>80?"Zo'r!":"Yana bir bor urinib ko'ring."}`;bump(pc>70)};
 r.onerror=()=>msg("Mikrofon ishlamadi.");rdRec=r;$("#rdrb").textContent="⏹ To'xtatish";try{r.start()}catch(e){rdRec=null}}
